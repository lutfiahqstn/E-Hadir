<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Student registration</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/tokens.css">
        <link rel="stylesheet" href="assets/css/site.css">
        <link rel="stylesheet" href="assets/css/pages.css">
    </head>
    <body><a class="skip" href="#main">Skip to content</a>
        <header class="header">
            <div class="container header__inner">
                <a class="brand" href="student_dashboard.html" aria-label="E-Hadir — home">
                    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M4 8.5c4-1.9 7.8-1.6 12 .9 4.2-2.5 8-2.8 12-.9v16c-4-1.9-7.8-2.8-12-.9-4.2-2.5-8-2.8-12-.9Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
                    <path d="M16 9.4v16" stroke="currentColor" stroke-width="2.4" />
                    <circle cx="25" cy="6" r="3.2" fill="var(--sage)" />
                    </svg>
                    <span class="brand__word">E-Hadir</span>
                </a>
                <nav class="nav" id="site-nav" aria-label="Main">
                    <a href="student_dashboard.html" aria-current="page">Discover</a> 
                    <a href="my_registrations.html">My registrations</a> 
                    <a href="login.html">Sign out</a> 
                    <a class="nav__cta" href="student_dashboard.html">Browse events</a>
                </nav>
                <div class="header__tools">
                    <a class="header__search" href="student_dashboard.html#events" aria-label="Search events">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-3.5-3.5"/>
                        </svg>
                        <span>Search</span>
                    </a>
                    <a class="btn btn--outline header__cta" href="student_dashboard.html">Browse events</a>
                    <button class="burger" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
                        <span></span><span></span><span></span>
                    </button>
                </div>
                </div>
        </header>
        <main id="main">
            <section class='phead'>
                <div class='container'>
                    <div class='phead__inner'>
                        <p class='eyebrow'>JOIN THE CAMPUS COMMUNITY</p>
                        <h1>Create your E-Hadir account</h1>
                        <p class='lede'>Register once to discover workshops, join events and keep your tickets in one place.</p>
                    </div>
                </div>
            </section>
            <section class="section">
                <div class="container">
                    <form class="eh-form" data-reveal action="login.html" method="get">
                        <div class="field">
                            <label>Full name</label>
                            <input class="input" name="fullname" type="text" placeholder="Enter your full name">
                        </div>
                        <div class="field">
                            <label>Student ID</label>
                            <input class="input" name="studentid" type="text" placeholder="Enter student ID">
                        </div>
                        <div class="field">
                            <label>Email address</label>
                            <input class="input" name="email" type="text" placeholder="Enter student email">
                        </div>
                        <div class="field">
                            <label>Password</label>
                            <input class="input" name="password" type="password" placeholder="Create password">
                        </div>
                        <div class="field">
                            <label>Confirm password</label>
                            <input class="input" name="confirm_password" type="password" placeholder="Re-enter password">
                        </div>
                        <button class="btn btn--ink" type="submit">Create account</button>
                    </form>
                </div>
            </section>
        </main>
        <footer class="footer footer--compact">
            <div class="container footer__compact-inner">
                <p>&copy; E-Hadir</p>
            </div>
        </footer>
        <div class="toast" role="status" aria-live="polite" hidden></div>
        <script src="assets/js/main.js"></script>
    </body>
</html>
