    <body><a class="skip" href="#main">Skip to content</a>
        <header class="header">
            <div class="container header__inner">
                <a class="brand" href="committee_events.html" aria-label="E-Hadir — home">
                    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M4 8.5c4-1.9 7.8-1.6 12 .9 4.2-2.5 8-2.8 12-.9v16c-4-1.9-7.8-2.8-12-.9-4.2-2.5-8-2.8-12-.9Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
                    <path d="M16 9.4v16" stroke="currentColor" stroke-width="2.4" />
                    <circle cx="25" cy="6" r="3.2" fill="var(--sage)" />
                    </svg>
                    <span class="brand__word">E-Hadir</span>
                </a>
                <nav class="nav" id="site-nav" aria-label="Main">
                    <a href="committee_events.html">Events</a> 
                    <a href="create_event.html" aria-current="page">Create event</a> 
                    <a href="attendance.html">Attendance</a> 
                    <a href="login.html">Sign out</a> 
                    <a class="nav__cta" href="create_event.html">Create event</a>
                </nav>
                <div class="header__tools">
                    <a class="header__search" href="committee_events.html#event-list" aria-label="Search events">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-3.5-3.5"/>
                        </svg>
                        <span>Search</span>
                    </a>
                    <a class="btn btn--outline header__cta" href="create_event.html">Create event</a>
                    <button class="burger" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </div>
        </header>
        <main id="main">
            <section class='phead'>
                <div class='container'>
                    <div class='phead__inner'>
                        <p class='eyebrow'>COMMITTEE WORKSPACE</p>
                        <h1>Plan the next <span class='hl'>campus moment.</span></h1>
                        <p class='lede'>Add the information students need before deciding to register.</p>
                    </div>
                </div>
            </section>
            <section class="section">
                <div class="container">
                    <form class="eh-form" data-reveal action="committee_events.html" method="get">
                        <div class="field">
                            <label>Event name</label>
                            <input class="input" name="event_name" type="text" placeholder="Enter event name">
                        </div>
                        <div class="field">
                            <label>Description</label>
                            <textarea class="textarea" name="description" placeholder="Describe the event"></textarea>
                        </div>
                        <div class="field">
                            <label>Event date</label>
                            <input class="input" name="event_date" type="date">
                        </div>
                        <div class="field">
                            <label>Venue</label>
                            <input class="input" name="venue" type="text" placeholder="Enter venue">
                        </div>
                        <div class="field">
                            <label>Start time</label>
                            <input class="input" name="start_time" type="time">
                        </div>
                        <div class="field">
                            <label>End time</label>
                            <input class="input" name="end_time" type="time">
                        </div>
                        <div class="field">
                            <label>Maximum capacity</label>
                            <input class="input" name="capacity" type="number" min="1" placeholder="e.g. 50">
                        </div>
                        <button class="btn btn--ink" type="submit">Save event</button> 
                        <button class="btn btn--outline" type="reset">Clear form</button>
                    </form>
                </div>
            </section>
        </main>
        <footer class="footer footer--compact">
            <div class="container footer__compact-inner">
                <p>&copy; E-Hadir</p>
            </div>
        </footer>
        <div class="toast" role="status" aria-live="polite" hidden></div>
        <script src="assets/js/main.js"></script>
    </body>
</html>
